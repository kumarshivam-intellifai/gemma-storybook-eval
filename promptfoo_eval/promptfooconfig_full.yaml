# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: NVIDIA Gemma-4-26B-A4B-NVFP4 full 64-case storybook evaluation

prompts:
  - id: file://generate_prompt.py:create_prompt
    label: Exact storybook system prompt with each dataset case

providers:
  - id: openai:chat:gemma-4-26b-a4b-nvfp4
    label: nvidia/Gemma-4-26B-A4B-NVFP4 via local vLLM
    config:
      apiBaseUrl: http://127.0.0.1:38080/v1
      apiKey: local-vllm
      temperature: 0.7
      top_p: 0.9
      max_tokens: 22000

defaultTest:
  assert:
    - type: python
      value: file://storybook_assertions_full.py:evaluate_storybook
      metric: Storybook compliance
    - type: latency
      threshold: 240000
      metric: Response under 240 seconds

tests:
  - file://generate_full_tests.py:create_tests

commandLineOptions:
  maxConcurrency: 1
  cache: false
  share: false
